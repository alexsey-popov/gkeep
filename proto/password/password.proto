edition = "2023";

package proto.password;

option go_package = "github.com/alexsey-popov/gkeep/proto/password";

// Пароль
message Password {
  string id = 1;
  string name = 2;
  string login = 3;
  string password = 4;
}

message PasswordListRequest {
  string name = 1;
  string page = 2;
}

message PasswordCreateRequest {
  string name = 1;
  string login = 2;
  string password = 3;
}

message PasswordUpdateRequest {
  string login = 1;
  string password = 2;
}

message PasswordDeleteRequest {
  string id = 1;
}

message PasswordListResponse {
  repeated Password password = 1;
  string error = 2;
}

message PasswordResponse {
  Password password = 1;
  string error = 2;
}