edition = "2023";

package proto.password;

option go_package = "github.com/alexsey-popov/gkeep/proto/password";

// Пароль
message Password {
  string id = 1;
  string name = 2;
  string login = 3;
  string password = 4;
}

// Структура запроса на создание записи
message CreateRequest {
  string name = 1;
  string login = 2;
  string password = 3;
}

// Структура запроса на редактирование записи
message UpdateRequest {
  string id = 1;
  string name = 2;
  string login = 3;
  string password = 4;
}

// Структура ответа со списком записей
message ListResponse {
  repeated Password password = 1;
  string error = 2;
}

// Структура ответа с одной записью
message Response {
  Password password = 1;
  string error = 2;
}