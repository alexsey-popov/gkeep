edition = "2023";

package proto.user;

option go_package = "github.com/alexsey-popov/gkeep/proto/user";

// Пользователь
message User {
  string id = 1;
  string login = 2;
}

// Структура запроса
message Request {
  string login = 1;
  string password = 2;
}

// Структура ответа
message Response {
  User user = 1;
  string error = 2;
}