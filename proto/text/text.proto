edition = "2023";

package proto.text;

option go_package = "github.com/alexsey-popov/gkeep/proto/text";

// Текст
message Text {
  string id = 1;
  string name = 2;
  string text = 3;
}

// Структура запроса на создание записи
message CreateRequest {
  string name = 1;
  string text = 2;
}

// Структура запроса на редактирование записи
message UpdateRequest {
  string id = 1;
  string name = 2;
  string text = 3;
}

// Структура ответа со списком записей
message ListResponse {
  repeated Text text = 1;
  string error = 2;
}

// Структура ответа с одной записью
message Response {
  Text text = 1;
  string error = 2;
}