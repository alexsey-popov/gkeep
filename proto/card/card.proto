edition = "2023";

package proto.card;

option go_package = "github.com/alexsey-popov/gkeep/proto/card";

// Карта
message Card {
  string id = 1;
  string name = 2;
  string number = 3;
  string expired = 4;
  string code = 5;
}

message CardListRequest {
  string name = 1;
  string page = 2;
}

message CardCreateRequest {
  string name = 1;
  string number = 2;
  string expired = 3;
  string code = 4;
}

message CardUpdateRequest {
  string id = 1;
  string name = 2;
  string number = 3;
  string expired = 4;
  string code = 5;
}

message CardShowRequest {
  string id = 1;
}

message CardDeleteRequest {
  string id = 1;
}

message CardListResponse {
  repeated Card card = 1;
  string error = 2;
}

message CardResponse {
  Card card = 1;
  string error = 2;
}