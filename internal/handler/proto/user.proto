edition = "2023";

package models;

option go_package = "internal/handler/proto";

// Пользователь
message User {
  string id = 1;
  string login = 2;
}

message UserRequest {
  string login = 1;
  string password = 2;
}

message UserResponse {
  User user = 1;
  string error = 2;
}

service Users {
  rpc RegisterUser(UserRequest) returns (UserResponse);
  rpc LoginUser(UserRequest) returns (UserResponse);
}